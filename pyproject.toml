[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "termytedb"
version = "0.1.0"
description = "Memory engine for AI agents"
requires-python = ">=3.11"
dependencies = [
  "fastembed>=0.7,<1",
  "numpy>=1.26,<3",
  "pydantic>=2.7,<3",
  "sqlite-vec>=0.1,<1",
]

[project.optional-dependencies]
tokenizer = [
  "tiktoken>=0.7,<1",
]
benchmark = [
  "flashrank>=0.2,<1",
  "python-dotenv>=1,<2",
]
dev = [
  "mypy>=1.11,<2",
  "pytest>=8,<9",
  "ruff>=0.6,<1",
]

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]

[tool.ruff]
line-length = 160
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]
